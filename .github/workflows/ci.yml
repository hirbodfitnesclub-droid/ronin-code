name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gui-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (all workspaces)
        run: npm run install:all
      - name: Host syntax check
        run: node --check host/src/server.js
      - name: GUI lint
        run: npm run lint
      - name: GUI typecheck
        run: npm run typecheck
      - name: GUI unit tests (pure helpers — format, diff, i18n)
        run: npm --prefix gui test
      - name: GUI build
        run: npm run build
      - name: Bundle budget (gzipped JS must stay under 300 KB)
        run: |
          SIZE=$(gzip -c gui/dist/assets/*.js | wc -c)
          echo "gzipped JS: $SIZE bytes (budget: 307200)"
          test "$SIZE" -lt 307200
      - name: Host unit tests (pure logic)
        run: npm --prefix host run test:unit
      - name: Host E2E (mock provider — trust layer, router, plan, ideas)
        run: node host/test/e2e.mjs
      - name: Provision GoTrue binary (server tests)
        run: |
          mkdir -p server/tools
          curl -fsSL "https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz" | tar -xJ -C /tmp
          install -m 0755 /tmp/auth server/tools/auth
          echo "c66b5efc816ccf3e13c24022bdefd5c6a9bea1fd1a1aeb9c586e1279c75a6306  server/tools/auth" | sha256sum -c -
      - name: Server tests (auth, ledger, claims, metering)
        run: npm --prefix server test
