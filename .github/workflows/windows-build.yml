name: Windows Build

# Builds the Ronin Code desktop installer (.exe, NSIS) on a Windows runner.
# Manual runs plus release tags. The Linux dev environment has no Rust
# toolchain, so this workflow is where the Tauri shell is compiled.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install host + GUI dependencies
        run: npm run install:all

      - name: Build GUI
        run: npm run build

      # Pinned Node runtime that ships inside the app as the host sidecar.
      # Keep this version in sync with desktop/stage.mjs (NODE_VERSION).
      - name: Download bundled Node runtime (win-x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/win-x64/node.exe" -OutFile "desktop/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"

      # --host-only: stage host + GUI resources and install host deps,
      # without re-downloading Node (downloaded in the step above).
      - name: Stage host + GUI resources
        run: node desktop/stage.mjs --host-only

      - name: Build desktop installer
        working-directory: desktop
        run: npx -y @tauri-apps/cli@^2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ronin-code-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
